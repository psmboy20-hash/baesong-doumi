<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배송 도우미</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%233182f6%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M3 7h18v12H3z%22/><path d=%22M3 11h18%22/></svg>">
</head>
<body>
<aside class="side">
  <div class="brand" onclick="go('home');return false">배송 도우미 <span id="ver" class="ver"></span></div>
  <div class="side-search">
    <input id="global-search" type="text" placeholder="이름·전화·송장·주문번호 검색"
      onkeydown="if(event.key==='Enter'){go('customers', this.value); this.blur();}">
  </div>
  <nav id="nav">
    <a href="#" data-page="home" onclick="go('home');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>처음</span>
    </a>
    <a href="#" data-page="send" onclick="go('send');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12H3z"/><path d="M3 11h18"/></svg>
      <span>보내기</span>
    </a>
    <a href="#" data-page="epost" onclick="go('epost');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m4 8 8 5 8-5"/></svg>
      <span>우체국 접수</span>
    </a>
    <a href="#" data-page="shipping" onclick="go('shipping');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>배송 확인</span>
    </a>
    <a href="#" data-page="returns" onclick="go('returns');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5l2 2"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M4 20v-5h5"/></svg>
      <span>교환/반품</span>
    </a>
    <a href="#" data-page="customers" onclick="go('customers');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>고객</span>
    </a>
    <a href="#" data-page="inventory" onclick="go('inventory');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v13H4z"/><path d="M8 7V4h8v3"/><path d="M4 12h16"/></svg>
      <span>재고</span>
    </a>
    <a href="#" data-page="stats" onclick="go('stats');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      <span>통계</span>
    </a>
    <a href="#" data-page="settings" onclick="go('settings');return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3.9a7 7 0 0 0-1.7-1L14.5 3h-5l-.4 2.4a7 7 0 0 0-1.7 1l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 1.7 1l.4 2.4h5l.4-2.4a7 7 0 0 0 1.7-1l2.3.9 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg>
      <span>설정</span>
    </a>
  </nav>
  <div class="side-foot" id="side-status"></div>
</aside>

<main id="main"></main>

<div id="toast"></div>
<div id="img-preview" class="hidden"></div>
<div id="overlay" class="hidden">
  <div class="spinner"></div>
  <div id="overlay-msg">잠시만 기다려 주세요…</div>
</div>

<script src="item-lines.js"></script>
<script src="ui.js"></script>
<script src="app-core.js"></script>
<script src="pages/home.js"></script>
<script src="pages/send.js"></script>
<script src="pages/epost.js"></script>
<script src="pages/shipping.js"></script>
<script src="pages/returns.js"></script>
<script src="pages/customers.js"></script>
<script src="pages/inventory.js"></script>
<script src="pages/settings.js"></script>
<script src="pages/stats.js"></script>
<script src="app-init.js"></script>
</body>
</html>
