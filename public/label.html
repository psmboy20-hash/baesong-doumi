<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>운송장 인쇄</title>
<script src="jsbarcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Malgun Gothic", sans-serif; background: #eee; }
  .toolbar { padding: 12px; text-align: center; background: #fff; border-bottom: 1px solid #ccc; }
  .toolbar button { font-size: 18px; font-weight: 700; padding: 10px 24px; cursor: pointer; border-radius: 8px; border: 2px solid #1a6ee0; background: #1a6ee0; color: #fff; font-family: inherit; }
  .toolbar select { font-size: 16px; padding: 8px; margin-left: 12px; border-radius: 8px; font-family: inherit; }
  #sheet { margin: 8px auto; }

  /* ===== 라벨기용 (100 x 150mm, 한 장 = 한 페이지) ===== */
  .rlabel {
    width: 100mm; height: 150mm;
    background: #fff; color: #000;
    margin: 0 auto 6mm;
    padding: 2.5mm;
    display: flex; flex-direction: column;
    page-break-after: always;
    font-size: 3.1mm; line-height: 1.25;
    overflow: hidden;
  }
  .r-area { display: flex; align-items: center; gap: 2mm; border-bottom: 0.5mm solid #000; padding-bottom: 1.5mm; font-weight: 900; }
  .r-area .cn { font-size: 10mm; }
  .r-area .cn.inv { background: #000; color: #fff; padding: 0 1.5mm; border-radius: 1mm; }
  .r-area .nm { font-size: 3.6mm; }
  .r-area .dn { font-size: 10mm; }
  .r-area .team { margin-left: auto; text-align: center; }
  .r-area .team .tt { font-size: 8mm; }
  .r-area .team .course { font-size: 3.6mm; }
  .r-recv { padding: 2mm 1mm; border-bottom: 0.3mm solid #888; }
  .r-recv .addr1 { font-size: 3.4mm; }
  .r-recv .addr2 { font-size: 5.2mm; font-weight: 900; margin: 1mm 0; }
  .r-recv .rname { font-size: 6.5mm; font-weight: 900; display: inline-block; margin-top: 1mm; }
  .r-recv .tel { font-size: 3.8mm; font-weight: 700; float: right; margin-top: 3mm; }
  .r-regi { text-align: center; padding: 1.5mm 0; border-bottom: 0.3mm solid #888; }
  .r-regi .rn { font-size: 6mm; font-weight: 900; letter-spacing: 0.4mm; }
  .r-regi svg { width: 92mm; height: 17mm; display: block; margin: 1mm auto 0; }
  .r-sender { padding: 1.5mm 1mm; font-size: 3mm; border-bottom: 0.3mm solid #888; }
  .r-prod { flex: 1; padding: 1.5mm 1mm; display: flex; gap: 2mm; min-height: 0; overflow: hidden; }
  .r-prod .plist { flex: 1; font-size: 3mm; }
  .r-prod .zipb { text-align: center; width: 26mm; }
  .r-prod .zipb svg { width: 24mm; height: 8mm; }
  .r-prod .zipb .zt { font-size: 3.4mm; font-weight: 700; letter-spacing: 0.8mm; }
  .r-foot { border-top: 0.5mm solid #000; padding-top: 1mm; display: flex; justify-content: space-between; font-size: 2.7mm; align-items: center; }
  .r-foot .ct { font-size: 4mm; font-weight: 900; }

  /* ===== A4용 (C형 168 x 107mm, 한 장에 2개) ===== */
  .sheet-a4 { width: 210mm; background: #fff; padding: 6mm 0; margin: 0 auto; }
  .label {
    width: 168mm; height: 107mm;
    border: 0.4mm solid #d84315; border-radius: 2mm;
    margin: 0 auto 5mm;
    display: flex; flex-direction: column;
    overflow: hidden; background: #fff;
    page-break-inside: avoid;
    font-size: 3.2mm; line-height: 1.25; color: #000;
  }
  .top { display: flex; border-bottom: 0.4mm solid #d84315; height: 15mm; }
  .logo { width: 34mm; border-right: 0.4mm solid #d84315; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #d84315; font-weight: 900; }
  .logo .l1 { font-size: 3mm; }
  .logo .l2 { font-size: 5.5mm; letter-spacing: 0.5mm; }
  .areacd { flex: 1; display: flex; align-items: center; gap: 2.5mm; padding: 0 3mm; font-weight: 900; }
  .areacd .cn { font-size: 9mm; }
  .areacd .cn.inv { background: #000; color: #fff; padding: 0 1.5mm; border-radius: 1mm; }
  .areacd .nm { font-size: 3.6mm; }
  .areacd .dn { font-size: 9mm; }
  .areacd .team { margin-left: auto; text-align: center; }
  .areacd .team .tt { font-size: 7.5mm; background: #ffe082; padding: 0 1.5mm; border-radius: 1mm; }
  .areacd .team .course { font-size: 3.8mm; margin-top: 0.5mm; }
  .mid { flex: 1; display: flex; min-height: 0; }
  .left { width: 52mm; border-right: 0.4mm solid #d84315; display: flex; flex-direction: column; font-size: 2.9mm; }
  .left .box { padding: 1.2mm 2mm; border-bottom: 0.3mm solid #f0a08a; }
  .left .grow { flex: 1; overflow: hidden; }
  .zipbar { text-align: center; padding: 1mm 0; border-bottom: 0.3mm solid #f0a08a; }
  .zipbar svg { height: 9mm; }
  .zipbar .zt { font-size: 3.4mm; letter-spacing: 1mm; font-weight: 700; }
  .right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .sender { padding: 1.5mm 2.5mm; border-bottom: 0.4mm solid #d84315; font-size: 2.9mm; }
  .sender .who { font-weight: 700; }
  .recv { flex: 1; padding: 2mm 2.5mm; display: flex; flex-direction: column; min-height: 0; }
  .recv .addr1 { font-size: 3.2mm; }
  .recv .addr2 { font-size: 4.6mm; font-weight: 900; margin: 1mm 0; }
  .recv .rname { font-size: 5.2mm; font-weight: 900; margin-top: 1mm; }
  .recv .tel { font-size: 3.4mm; font-weight: 700; margin-top: 1mm; }
  .regino { border-top: 0.4mm solid #d84315; padding: 1.2mm 2.5mm; display: flex; align-items: center; gap: 3mm; }
  .regino .rt { font-size: 3.2mm; }
  .regino .rn { font-size: 5.6mm; font-weight: 900; letter-spacing: 0.3mm; }
  .bottom { border-top: 0.4mm solid #d84315; height: 22mm; display: flex; align-items: center; }
  .contract { width: 34mm; text-align: center; font-size: 4.6mm; font-weight: 900; border-right: 0.4mm solid #d84315; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .contract .cs { font-size: 2.6mm; font-weight: 400; }
  .longbar { flex: 1; text-align: center; }
  .longbar svg { height: 16mm; width: 95%; }

  /* ===== C형 라벨: 오즈뷰어 출력과 동일한 배치 (절대좌표, mm) ===== */
  .clabel {
    width: 168mm; height: 107mm; position: relative;
    background: #fff; color: #000; margin: 0 auto; overflow: hidden;
    font-family: "Malgun Gothic", sans-serif;
  }
  body:not(.formpaper) .clabel { outline: 0.4mm solid #d84315; }
  @media screen { body.formpaper .clabel { outline: 1px dashed #bbb; } }
  .clabel .f { position: absolute; line-height: 1.2; white-space: nowrap; }
  .clabel .wrap { white-space: normal; }
  .clabel .inv { background: #000; color: #fff; padding: 0 1.2mm; }
  .clabel .vstrip { position: absolute; right: 0; top: 0; width: 20mm; height: 107mm; overflow: hidden; }
  .clabel .vinner {
    position: absolute; left: 0; top: 105mm;
    transform: rotate(-90deg); transform-origin: top left;
    width: 103mm; height: 20mm;
    display: flex; align-items: center; gap: 1.5mm;
    font-size: 2.5mm; line-height: 1.15;
  }

  /* ===== 양식지 모드: 틀(빨간선·로고·고정문구)이 미리 인쇄된 우체국 용지 → 데이터만 인쇄 ===== */
  body.formpaper .label, body.formpaper .top, body.formpaper .left, body.formpaper .left .box,
  body.formpaper .zipbar, body.formpaper .sender, body.formpaper .regino, body.formpaper .bottom,
  body.formpaper .contract, body.formpaper .logo { border-color: transparent !important; }
  body.formpaper .logo *, body.formpaper .contract *, body.formpaper .regino .rt { visibility: hidden; }
  body.formpaper .contract, body.formpaper .logo { color: transparent; }
  body.formpaper .areacd .team .tt { background: transparent; }
  @media screen {
    /* 화면에서는 위치 확인용으로 틀을 연하게 보여줌 */
    body.formpaper .label { outline: 1px dashed #bbb; }
  }

  @media screen {
    .rlabel { border: 1px dashed #999; }
  }
  @media print {
    .toolbar { display: none; }
    body { background: #fff; }
    .rlabel { margin: 0; border: none; }
    .sheet-a4 { margin: 0; padding: 4mm 0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨 인쇄하기</button>
  <select id="paper" onchange="setPaper(this.value)">
    <option value="post">우체국 전용라벨 C형 168×107 (6인치 라벨기)</option>
    <option value="roll">택배라벨 100×150mm</option>
    <option value="a4">일반 A4 (잘라 붙이기)</option>
  </select>
  <label style="margin-left:12px;font-size:16px;font-weight:700">
    <input type="checkbox" id="formpaper" onchange="setFormPaper(this.checked)"> 틀이 인쇄된 우체국 용지 (바코드·글자만 인쇄)
  </label>
  <span style="margin-left:12px;font-size:15px">위치 맞추기:
    <button class="nud" onclick="nudge(0,-1)">▲</button><button class="nud" onclick="nudge(0,1)">▼</button><button class="nud" onclick="nudge(-1,0)">◀</button><button class="nud" onclick="nudge(1,0)">▶</button>
    <span id="off">0, 0</span>mm <button class="nud" onclick="setOffset(0,0)">처음으로</button>
  </span>
  <br><span id="paper-hint" style="color:#555">라벨기에서 한 장씩 나옵니다. 인쇄 창에서 프린터를 라벨기로 선택하세요.</span>
</div>
<style>.nud { font-size: 15px; padding: 4px 10px; border: 1px solid #999; background: #f5f5f5; color: #222; border-radius: 6px; cursor: pointer; }</style>
<style id="pagestyle"></style>
<div id="sheet">불러오는 중…</div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function maskName(n) { n = String(n || '').trim(); return n.length < 2 ? n : n[0] + '*' + n.slice(2); }
function fmtRegi(r) { const d = String(r || '').replace(/\D/g, ''); return d.length === 13 ? d.slice(0,5) + '-' + d.slice(5,9) + '-' + d.slice(9) : r; }
function fmtVtel(v) { const d = String(v).replace(/\D/g, ''); return d.length >= 10 ? d.slice(0,4) + '-' + d.slice(4, d.length-4) + '-' + d.slice(-4) : v; }
function cleanA(a) { return String(a || '').replace(/\(\d{5}\)/g, '').trim(); }
function parseArea(lb) {
  const s = String((lb && lb.printAreaCd) || '').trim();
  const m = s.match(/^(\S+?)\((.+?)\)\s+(\S+?)\((.+?)\)\s+(\d{2})\s*(\d{2})$/);
  if (m) return { cn: m[1], cnNm: m[2], dn: m[3], dnNm: m[4], team: m[5] + ' ' + m[6] };
  return { cn: '', cnNm: (lb && lb.arrCnpoNm) || '', dn: '', dnNm: (lb && lb.delivPoNm) || '', team: '', raw: s || ((lb && lb.delivAreaCd) || '') };
}
function splitAddr(addr) {
  addr = String(addr || '').replace(/\(\d{5}\)/g, '').trim();
  let a1 = addr, a2 = '';
  const cut = addr.length > 18 ? addr.lastIndexOf(' ', Math.floor(addr.length * 0.55)) : -1;
  if (cut > 5) { a1 = addr.slice(0, cut); a2 = addr.slice(cut + 1); }
  return [a1, a2]; // 짧은 주소는 둘째 줄 비움 (같은 주소 두 번 인쇄 방지)
}

let LABELS = [], DBREF = null, MODE = 'roll';

function areaHtml(a, lb, cls) {
  const invCn = a.cn && !/^[ABC]/.test(a.cn);
  if (a.raw) return `<span class="dn">${esc(a.raw)}</span>`;
  return `<span class="cn ${invCn ? 'inv' : ''}">${esc(a.cn)}</span><span class="nm">${esc(a.cnNm)}</span>
    <span class="dn">${esc(a.dn)}</span><span class="nm">${esc(a.dnNm)}</span>
    <span class="team"><span class="tt">${esc(a.team)}</span><div class="course">${lb.courseNo ? '- ' + esc(lb.courseNo) + ' -' : ''}</div></span>`;
}

function renderRoll() {
  const st = DBREF.settings;
  return LABELS.map((L, i) => {
    const it = L.it, ep = it.epost, lb = ep.label || {};
    const a = parseArea(lb);
    const zip = String(it.zip || lb.refineZip || '').replace(/\D/g, '').slice(0, 5);
    const [a1, a2] = splitAddr(it.addr);
    return `
    <div class="rlabel">
      <div class="r-area">${areaHtml(a, lb)}</div>
      <div class="r-recv">
        <div class="addr1">${esc(a1)} &nbsp; ${esc(zip)}</div>
        <div class="addr2">${esc(a2)}</div>
        <span class="rname">${esc(maskName(it.name))} 님께</span>
        <span class="tel">${lb.vTelNo ? esc(fmtVtel(lb.vTelNo)) : esc(it.phone || '')}</span>
      </div>
      <div class="r-regi">
        <span class="rn">${esc(fmtRegi(it.invoice))}</span>
        <svg id="regi${i}"></svg>
      </div>
      <div class="r-sender">보내는 분: <b>${esc(st.senderName || '')}</b> &nbsp; ${esc(cleanA(st.senderAddr))} &nbsp; ${esc(st.senderZip || '')} &nbsp; T: ${esc(st.senderPhone || '')}</div>
      <div class="r-prod">
        <div class="plist">${L.products.join('<br>')}${it.msg ? '<br><b>※ ' + esc(it.msg) + '</b>' : ''}</div>
        <div class="zipb"><svg id="zip${i}"></svg><div class="zt">${esc(zip)}</div></div>
      </div>
      <div class="r-foot">
        <span class="ct">계약소포</span>
        <span>접수국: ${esc(lb.regipoNm || (DBREF.epost && DBREF.epost.officeNm) || '')} · ${esc(it.sentDate || '')} · 주문번호 ${esc(ep.orderNo || '')} · ☎1588-1300</span>
      </div>
    </div>`;
  }).join('');
}

function renderPost() { // C형 한 장 = 한 페이지 (6인치 라벨기)
  return LABELS.map((L, i) => '<div style="page-break-after:always">' + labelC(L, i) + '</div>').join('');
}
function renderA4() {
  return '<div class="sheet-a4">' + LABELS.map((L, i) => labelC(L, i)).join('') + '</div>';
}
function labelC(L, i) { // 오즈뷰어 C형 출력과 같은 배치
  const st = DBREF.settings;
  const it = L.it, ep = it.epost, lb = ep.label || {};
  const a = parseArea(lb);
  const zip = String(it.zip || lb.refineZip || '').replace(/\D/g, '').slice(0, 5);
  const addr = cleanA(it.addr);
  const vtel = lb.vTelNo ? fmtVtel(lb.vTelNo) : (it.phone || '');
  const prod = L.products.join(' ') + (it.msg ? ' ※' + esc(it.msg) : '');
  const invCn = a.cn && !/^[ABC]/.test(a.cn);
  return `
  <div class="clabel">
    <!-- 좌측 상단: 접수국/신청일/주문처/요금 -->
    <div class="f" style="left:3mm; top:12mm; font-size:3mm">접수국 : ${esc(lb.regipoNm || '')} &nbsp;&nbsp; 신청일 : ${esc((it.sentDate || '').replace(/-/g, '/'))}</div>
    <div class="f" style="left:3mm; top:19mm; font-size:3mm">주문인:</div>
    <div class="f" style="left:3mm; top:23.5mm; font-size:3mm">고객 주문처: ${esc(st.senderName || '')}</div>
    <div class="f" style="left:18mm; top:30.5mm; font-size:3.2mm">요금: 계약요금</div>
    <!-- 좌측: 우편번호 바코드 -->
    <div class="f" style="left:6mm; top:35mm"><svg id="zip${i}" style="width:32mm;height:10mm"></svg></div>
    <div class="f" style="left:40mm; top:36mm; font-size:2.8mm">(1/1)</div>
    <div class="f" style="left:40mm; top:41mm; font-size:2.8mm">(1/1)</div>
    <div class="f" style="left:9mm; top:45.5mm; font-size:4mm; letter-spacing:2mm; font-weight:700">${esc(zip)}</div>
    <!-- 좌측 하단: 내용품 -->
    <div class="f wrap" style="left:3mm; top:53mm; width:47mm; font-size:2.9mm">${prod}</div>
    <!-- 상단: 집배코드 -->
    <div class="f" style="left:56mm; top:5mm; font-size:9mm; font-weight:900"><span class="${invCn ? 'inv' : ''}">${esc(a.cn)}</span><span style="font-size:3.4mm; font-weight:700">${esc(a.cnNm)}</span> ${esc(a.dn)}<span style="font-size:3.4mm; font-weight:700">${esc(a.dnNm)}</span>${a.raw ? esc(a.raw) : ''}</div>
    <div class="f" style="left:118mm; top:5mm; font-size:8mm; font-weight:900">${esc(a.team)}</div>
    <div class="f" style="left:120mm; top:14mm; font-size:4mm; font-weight:700">${lb.courseNo ? '- ' + esc(lb.courseNo) + ' -' : ''}</div>
    <!-- 보내는 분 -->
    <div class="f wrap" style="left:55mm; top:21mm; width:80mm; font-size:3.1mm">${esc(cleanA(st.senderAddr))}</div>
    <div class="f" style="left:137mm; top:21mm; font-size:3.1mm">${esc(st.senderZip || '')}</div>
    <div class="f" style="left:55mm; top:29mm; font-size:3.4mm; font-weight:900">${esc(st.senderName || '')}</div>
    <div class="f" style="left:110mm; top:29mm; font-size:3.1mm">M: ${esc(st.senderPhone || '')}</div>
    <!-- 받는 분 -->
    <div class="f wrap" style="left:55mm; top:39mm; width:90mm; font-size:5mm; font-weight:900; line-height:1.35">${esc(addr)} .</div>
    <div class="f" style="left:55mm; top:58mm; font-size:6.5mm; font-weight:900">${esc(maskName(it.name))} 님</div>
    <div class="f" style="left:55mm; top:67mm; font-size:5mm; font-weight:900">T: ${esc(vtel)}</div>
    <div class="f" style="left:55mm; top:73mm; font-size:2.4mm">※ 고객님의 개인정보 보호를 위하여 임시 가상번호를 사용합니다.</div>
    <!-- 등기번호 + 대형 바코드 -->
    <div class="f" style="left:55mm; top:77mm; font-size:5mm; font-weight:900">등기번호: ${esc(fmtRegi(it.invoice))}</div>
    <div class="f" style="left:55mm; top:84mm"><svg id="regi${i}" style="width:85mm;height:17mm"></svg></div>
    <!-- 우측 세로 절취 스트립 -->
    <div class="vstrip">
      <div class="vinner">
        <svg id="vregi${i}" style="width:34mm;height:8mm;flex-shrink:0"></svg>
        <b style="font-size:2.8mm">${esc(fmtRegi(it.invoice))}</b>
        <span style="overflow:hidden">내용품 : ${esc(L.products.join(' ').slice(0, 34))}</span>
        <b>${esc(maskName(it.name))} 님</b>
        <span>${esc(vtel)}</span>
        <span style="overflow:hidden">${esc(addr.slice(0, 22))}</span>
      </div>
    </div>
  </div>`;
}

function drawBarcodes() {
  LABELS.forEach((L, i) => {
    const zip = String(L.it.zip || (L.it.epost.label && L.it.epost.label.refineZip) || '').replace(/\D/g, '').slice(0, 5);
    const regi = String(L.it.invoice || '').replace(/\D/g, '');
    try { if (zip.length === 5) JsBarcode('#zip' + i, zip, { format: 'CODE128', displayValue: false, margin: 0, height: 34 }); } catch (e) {}
    try { if (regi.length === 13) JsBarcode('#regi' + i, regi, { format: 'CODE128', displayValue: false, margin: 0, height: 60 }); } catch (e) {}
    try { if (regi.length === 13 && document.getElementById('vregi' + i)) JsBarcode('#vregi' + i, regi, { format: 'CODE128', displayValue: false, margin: 0, height: 30 }); } catch (e) {}
  });
}

// 양식지 모드 (기본 켜짐 — 우체국 전용라벨은 틀이 미리 인쇄돼 있음)
function setFormPaper(v) {
  localStorage.setItem('labelFormPaper', v ? '1' : '0');
  document.body.classList.toggle('formpaper', v);
  document.getElementById('formpaper').checked = v;
}
// 인쇄 위치 미세조정 (mm) — 프린터마다 물리 여백이 달라서 양식지 칸과 어긋날 때 사용
function applyOffset() {
  const x = Number(localStorage.getItem('labelOffX') || 0);
  const y = Number(localStorage.getItem('labelOffY') || 0);
  document.getElementById('sheet').style.transform = `translate(${x}mm, ${y}mm)`;
  document.getElementById('off').textContent = x + ', ' + y;
}
function setOffset(x, y) {
  localStorage.setItem('labelOffX', x);
  localStorage.setItem('labelOffY', y);
  applyOffset();
}
function nudge(dx, dy) {
  setOffset(Number(localStorage.getItem('labelOffX') || 0) + dx, Number(localStorage.getItem('labelOffY') || 0) + dy);
}
function setPaper(mode) {
  MODE = mode;
  localStorage.setItem('labelPaper', mode);
  document.getElementById('paper').value = mode;
  const page = {
    post: '@page { size: 168mm 107mm; margin: 0; } .clabel { margin: 0 auto; }',
    roll: '@page { size: 100mm 150mm; margin: 0; }',
    a4: '@page { size: A4 portrait; margin: 5mm; }'
  };
  const hint = {
    post: '우체국 전용라벨(C형)이 한 장씩 나옵니다. 인쇄 창에서 프린터를 라벨기로 선택하세요.',
    roll: '라벨기에서 한 장씩 나옵니다. 인쇄 창에서 프린터를 라벨기로 선택하세요.',
    a4: 'A4에 인쇄해서 잘라 붙이세요.'
  };
  document.getElementById('pagestyle').textContent = page[mode] || page.post;
  document.getElementById('paper-hint').textContent = hint[mode] || '';
  document.getElementById('sheet').innerHTML = mode === 'roll' ? renderRoll() : (mode === 'a4' ? renderA4() : renderPost());
  drawBarcodes();
}

async function main() {
  setFormPaper(localStorage.getItem('labelFormPaper') !== '0'); // 기본: 양식지 모드 켜짐
  applyOffset();
  const params = new URLSearchParams(location.search);
  const sel = (params.get('sel') || '').split(',').filter(Boolean);
  DBREF = await (await fetch('/api/db')).json();
  const items = [];
  for (const s of sel) {
    const [type, idStr] = s.split(':');
    const list = type === 'seeding' ? DBREF.seeding : DBREF.orders;
    const it = list.find(x => x.id === Number(idStr));
    if (it && it.epost) items.push({ type, it });
  }
  const seen = new Set();
  LABELS = [];
  const prodLine = it => {
    const opt = [it.color, it.size].filter(Boolean).join(' ') || it.option || '';
    return esc(String(it.product || '').slice(0, 44)) + (opt ? ', ' + esc(opt) : '') + ', 수량:' + (it.qty || 1);
  };
  for (const { it } of items) {
    if (seen.has(it.epost.orderNo)) { LABELS[LABELS.length - 1].products.push(prodLine(it)); continue; }
    seen.add(it.epost.orderNo);
    LABELS.push({ it, products: [prodLine(it)] });
  }
  if (!LABELS.length) { document.getElementById('sheet').innerHTML = '<p style="padding:2rem">인쇄할 운송장이 없어요. (앱에서 접수한 건만 인쇄할 수 있습니다)</p>'; return; }
  setPaper(localStorage.getItem('labelPaper') || 'post');
  if (params.get('print') === '1') setTimeout(() => window.print(), 700);
}
main();
</script>
</body>
</html>
