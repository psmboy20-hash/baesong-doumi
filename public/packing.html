<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포장 명세</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @page { size: 105mm 148mm; margin: 6mm; }
  body { font-family: "Malgun Gothic", "맑은 고딕", sans-serif; padding: 20px; color: #1c2333; background: #eef1f7; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .toolbar .btn { font-size: 15px; font-weight: 700; padding: 8px 16px; border: none; border-radius: 10px; background: #1a6ee0; color: #fff; cursor: pointer; }
  .toolbar .count { color: #5a6478; font-size: 13px; }
  #out { display: flex; flex-wrap: wrap; gap: 16px; }
  .sheet {
    width: 93mm; min-height: 136mm; background: #fff; border: 1px solid #d8dee8; border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; page-break-after: always;
  }
  .sheet .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: #5a6478; border-bottom: 1px solid #d8dee8; padding-bottom: 6px; margin-bottom: 10px; }
  .sheet .head .kind { font-weight: 700; color: #1a6ee0; }
  .sheet .recipient .name { font-size: 19px; font-weight: 900; }
  .sheet .recipient .phone { font-size: 13px; font-weight: 400; color: #5a6478; margin-left: 4px; }
  .sheet .recipient .addr { font-size: 13px; margin-top: 6px; line-height: 1.4; }
  table.items { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
  table.items th { text-align: left; font-size: 11px; color: #5a6478; border-bottom: 1px solid #d8dee8; padding: 4px; }
  table.items td { border-bottom: 1px solid #eef1f7; padding: 6px 4px; vertical-align: top; }
  table.items td.qty { text-align: right; font-weight: 700; white-space: nowrap; }
  .sheet .foot { display: flex; justify-content: space-between; font-size: 11px; color: #5a6478; margin-top: auto; padding-top: 10px; }
  .sheet .thanks { text-align: center; font-size: 13px; font-weight: 700; color: #1a6ee0; margin-top: 8px; }
  .muted { color: #8a93a5; font-size: 14px; padding: 20px 0; }
  @media print {
    body { padding: 0; background: #fff; }
    .toolbar { display: none; }
    #out { display: block; gap: 0; }
    .sheet { border: none; border-radius: 0; margin: 0 auto; }
    .sheet:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button class="btn" onclick="window.print()">인쇄하기</button>
  <span class="count" id="count"></span>
</div>
<div id="out">불러오는 중…</div>
<script src="item-lines.js"></script>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lettersOnly = s => String(s || '').toLowerCase().replace(/[^a-z가-힣]/g, '');
function splitColor(name) {
  const m = String(name || '').match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  return m ? { base: m[1], color: m[2] } : { base: String(name || ''), color: '' };
}
function matchProducts(products, text) {
  const t = lettersOnly(text);
  if (!t) return [];
  const hits = [];
  for (const p of products) {
    const stripped = String(p.name).replace(/^[A-Za-z]#?\d+_?/, '');
    const core = lettersOnly(stripped);
    if (!core || core.length < 6) continue;
    if (t.includes(core)) { hits.push({ p, pos: t.indexOf(core), exact: 1 }); continue; }
    const words = stripped.split(/[^A-Za-z가-힣]+/).map(lettersOnly).filter(w => w.length >= 3);
    if (words.length >= 2 && words.every(w => t.includes(w))) hits.push({ p, pos: t.indexOf(words[0]), exact: 0 });
  }
  hits.sort((a, b) => (b.exact - a.exact) || a.pos - b.pos);
  const seen = new Set();
  return hits.filter(h => !seen.has(h.p.no) && seen.add(h.p.no)).map(h => h.p);
}
// 옵션 표기 통일(최소본) — app-core.js의 parseOption과 같은 규칙
function parseOpt(line) {
  let color = String(line.color || '').trim();
  let size = String(line.size || '').trim();
  const raw = String(line.option || '').trim();
  if (raw) {
    const mc = raw.match(/색상\s*=\s*([^,/]+)/);
    const ms = raw.match(/사이즈\s*=\s*([^,/]+)/);
    if (mc && !color) color = mc[1].trim();
    if (ms && !size) size = ms[1].trim();
    if (!mc && !ms && !color && !size) size = raw;
  }
  return { color, size };
}
// 택배 1건 묶기 — app-core.js의 pendingFulfillmentKey와 같은 규칙(합포장·분리배송 반영)
function fulfillKey(type, x) {
  if (x.packGroupId) return 'pack:' + x.packGroupId;
  if (type === 'order' && x.orderNo && x.parcelSplitId) return 'split:' + x.orderNo + ':' + x.parcelSplitId;
  if (type === 'order' && x.orderNo) return 'order:' + x.orderNo;
  if (x.returnId) return 'return:' + x.returnId;
  return (type === 'seeding' ? 'seeding' : 'order') + ':' + x.id;
}
function lineRows(x, products) {
  const out = [];
  for (const line of HamItemLines.splitShipmentItems(x)) {
    const qty = Number(line.qty) || 1;
    const { color, size } = parseOpt(line);
    const matches = matchProducts(products, line.product);
    if (matches.length) {
      for (const p of matches) {
        const sc = splitColor(p.name);
        const opt = [sc.color || color, size].filter(Boolean).join(', ');
        out.push({ name: sc.base, opt: opt || '-', qty });
      }
    } else {
      out.push({ name: line.product || '(제품명 없음)', opt: [color, size].filter(Boolean).join(', ') || '-', qty });
    }
  }
  return out;
}
(async () => {
  const params = new URLSearchParams(location.search);
  const refs = String(params.get('ids') || '').split(',').map(s => s.trim()).filter(Boolean).map(s => {
    const [type, idStr] = s.split(':');
    return { type: type === 'seeding' ? 'seeding' : 'order', id: Number(idStr) };
  });
  const out = document.getElementById('out');
  if (!refs.length) { out.innerHTML = '<p class="muted">인쇄할 항목이 없어요. 주문 확인 화면에서 체크한 뒤 [포장 명세 인쇄]를 다시 눌러 주세요.</p>'; return; }
  let db;
  try {
    db = await (await fetch('/api/db')).json();
  } catch (e) {
    out.innerHTML = '<p class="muted">데이터를 불러오지 못했어요. 프로그램이 켜져 있는지 확인해 주세요.</p>';
    return;
  }
  const items = [];
  const seen = new Set();
  for (const ref of refs) {
    const key = ref.type + ':' + ref.id;
    if (seen.has(key)) continue;
    seen.add(key);
    const list = ref.type === 'seeding' ? db.seeding : db.orders;
    const x = list && list.find(i => i.id === ref.id);
    if (x) items.push({ type: ref.type, x });
  }
  if (!items.length) { out.innerHTML = '<p class="muted">항목을 찾지 못했어요. 목록이 바뀌었을 수 있어요.</p>'; return; }

  const groups = new Map();
  for (const { type, x } of items) {
    const key = fulfillKey(type, x);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ type, x });
  }
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  const products = db.products || [];
  let html = '';
  for (const g of groups.values()) {
    const first = g[0].x;
    const isSeeding = g.every(e => e.type === 'seeding');
    const phone4 = String(first.phone || '').replace(/\D/g, '').slice(-4);
    const rows = g.flatMap(e => lineRows(e.x, products));
    const rowsHtml = rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.opt)}</td><td class="qty">${r.qty}</td></tr>`).join('');
    html += `<div class="sheet">
      <div class="head"><span class="kind">${isSeeding ? '시딩' : '주문'}</span><span>누솔베르 nu.solvere</span></div>
      <div class="recipient">
        <div class="name">${esc(first.name)} 님<span class="phone">…${esc(phone4 || '----')}</span></div>
        <div class="addr">${esc(first.addr || '')}${first.zip ? ` (${esc(first.zip)})` : ''}</div>
      </div>
      <table class="items"><thead><tr><th>상품</th><th>옵션</th><th>수량</th></tr></thead><tbody>${rowsHtml}</tbody></table>
      <div class="foot"><span>주문번호 ${esc(first.orderNo || '-')}</span><span>인쇄일 ${dateStr}</span></div>
      <div class="thanks">감사합니다</div>
    </div>`;
  }
  out.innerHTML = html;
  document.getElementById('count').textContent = `택배 ${groups.size}건`;
  if (params.get('print') === '1') setTimeout(() => window.print(), 600);
})();
</script>
</body>
</html>
